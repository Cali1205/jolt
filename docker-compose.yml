services:
  jolt-db:
    image: postgres:16-alpine
    container_name: jolt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jolt
      POSTGRES_USER: jolt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}
    volumes:
      - /mnt/user/appdata/jolt-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jolt"]
      interval: 10s
      timeout: 5s
      retries: 5

  jolt-app:
    # Built by GitHub Actions on every merge to main (.github/workflows/ci.yml)
    # and pulled by Watchtower below. `docker compose build` still works for
    # a local image.
    image: ghcr.io/cali1205/jolt:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jolt-app
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      # Before replacing the container Watchtower runs this inside it; exit
      # code 75 = a trip is running, try again at the next run.
      com.centurylinklabs.watchtower.lifecycle.pre-update: "python /srv/tools/update_guard.py"
    depends_on:
      jolt-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jolt:${DB_PASSWORD}@jolt-db:5432/jolt
      # Zugang: leer lassen heisst "kein Login" - nur fuer den Betrieb in einem
      # Netz, in das ohnehin niemand sonst hineinkommt.
      APP_PASSWORT: ${APP_PASSWORT:-}
      # Routing: ohne Schluessel laesst sich keine Route rechnen.
      # Kostenloser Schluessel: https://openrouteservice.org/dev/#/signup
      ORS_API_KEY: ${ORS_API_KEY:?Bitte ORS_API_KEY in .env setzen}
      # TomTom als Berater fuer Alternativen und Verkehr (optional). Ohne
      # Schluessel laeuft die Planung wie bisher; gespeichert wird davon nichts.
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      # Open Charge Map nur fuer den Import ausserhalb Deutschlands noetig.
      OCM_API_KEY: ${OCM_API_KEY:-}
      # Haertung fuer einen exponierten Host
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      LOGIN_LIMIT_PER_15MIN: ${LOGIN_LIMIT_PER_15MIN:-10}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
      # Benachrichtigungen aufs Telefon: ohne diese drei bleibt die Funktion
      # aus, siehe tools/push_keyname.py.
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "8322:8000"
    # Hinter einem Reverse Proxy: jolt.<domain> -> host-ip:8322

  # (nickfedor fork: the original containrrr image no longer talks to current
  # Docker versions.) Looks for a new jolt-app image every 10 minutes and
  # restarts only that container (jolt-db has no label and is left alone). A
  # running trip is protected by the pre-update hook on jolt-app
  # (tools/update_guard.py): the update waits until the trip is over.
  # Migrations run at app start. Change the rhythm with WATCHTOWER_SCHEDULE
  # (six-field cron, with seconds), the time zone with TZ.
  # Optional trigger: with WATCHTOWER_HTTP_API_ENDPOINTS=update and a token, a
  # POST to /v1/update starts a run at once (the CI does that after pushing
  # the image, see README). Polling keeps running next to it.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: jolt-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 */10 * * * *}
      WATCHTOWER_HTTP_API_ENDPOINTS: ${WATCHTOWER_HTTP_API_ENDPOINTS:-}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Only used when the HTTP API is switched on.
      - "8099:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Nightly dump of the database at 03:30, half an hour before Watchtower may
  # restart the app. Keeps BACKUP_KEEP_DAYS days (default 14). Restore:
  #   gunzip -c jolt-<date>.sql.gz | docker exec -i jolt-db psql -U jolt jolt
  jolt-backup:
    image: postgres:16-alpine
    container_name: jolt-backup
    restart: unless-stopped
    depends_on:
      jolt-db:
        condition: service_healthy
    environment:
      PGHOST: jolt-db
      PGUSER: jolt
      PGDATABASE: jolt
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - /mnt/user/appdata/jolt-backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          h=$$(date +%H); m=$$(date +%M); s=$$(date +%S)
          now=$$(( $${h#0} * 3600 + $${m#0} * 60 + $${s#0} ))
          wait=$$(( 12600 - now ))
          [ "$$wait" -le 0 ] && wait=$$(( wait + 86400 ))
          sleep "$$wait"
          file=/backups/jolt-$$(date +%F).sql.gz
          if pg_dump | gzip > "$$file.part" && [ -s "$$file.part" ]; then
            mv "$$file.part" "$$file"
            echo "backup written: $$file"
          else
            rm -f "$$file.part"
            echo "backup FAILED"
          fi
          find /backups -name 'jolt-*.sql.gz' -mtime +$$KEEP_DAYS -delete
        done
