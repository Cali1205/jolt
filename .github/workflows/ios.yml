name: iOS

# This workflow answers exactly one question: can package.json and
# capacitor.config.json be turned into an iOS project that compiles?
#
# **The path filter is narrow, and that is deliberate.** macOS runners count
# with a factor of 10 against the minutes quota on private repositories: five
# minutes of building are fifty minutes used. A change to frontend/ is
# deliberately **not** in the list - the app loads its UI from the server at
# runtime (see server.url in capacitor.config.json), so a changed line in
# live.js needs no new app build. That is exactly why the Capacitor route was
# chosen: the fast deploy route via the container stays intact.
#
# What is missing here is a device build. It would need the certificate and
# provisioning profile as secrets; for "does it compile at all" that is a high
# price. The signed build including the TestFlight upload lives in
# ios-testflight.yml, and can be set up following ios-einrichten.md.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/ios_info_plist.sh"
      - "tools/ios_symbol.sh"
      - "tools/ios_widget.sh"
      - "tools/ios_widget.rb"
      - "tools/ios_carplay.sh"
      - "tools/ios_carplay.rb"
      - "plugins/**"
      - "ios-native/**"
      - "tools/ios-app-icon.png"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/ios_info_plist.sh"
      - "tools/ios_symbol.sh"
      - "tools/ios_widget.sh"
      - "tools/ios_widget.rb"
      - "tools/ios_carplay.sh"
      - "tools/ios_carplay.rb"
      - "plugins/**"
      - "ios-native/**"
      - "tools/ios-app-icon.png"
      - ".github/workflows/ios.yml"
  # Can be triggered by hand, to check the workflow once without having to
  # invent a change for it.
  workflow_dispatch:

jobs:
  bauen:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 is a requirement, not a preference: @capacitor/cli prints
      # "Unsupported engine" on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The runner ships several Xcode versions and does not necessarily pick
      # the newest. Pin it instead of hoping: otherwise the toolchain changes
      # under the project as soon as GitHub updates its image - and the
      # failure then looks like a code error.
      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Log versions
        run: |
          xcodebuild -version
          node --version

      - run: npm ci --no-audit --no-fund

      # ios/ is not checked in and is created anew here. A checked-in Xcode
      # project would be a second source of truth next to
      # capacitor.config.json, and the two would drift apart unnoticed.
      - name: Generate iOS project
        run: npx cap add ios

      # Must run **after** `cap add` and **before** building: the template
      # knows neither the Bluetooth usage descriptions nor the background
      # modes. Without NSBluetoothAlwaysUsageDescription, iOS removes the app
      # on the first CoreBluetooth access.
      - name: Add Info.plist entries
        run: bash tools/ios_info_plist.sh ios/App/App/Info.plist

      # The template's icon is the Capacitor logo.
      - name: Replace app icon
        run: bash tools/ios_symbol.sh

      - name: Sync
        run: npx cap sync ios

      # **After** the sync, not before: `cap sync` reads the minimum version
      # from the first IPHONEOS_DEPLOYMENT_TARGET in the project file and
      # writes it as `.iOS(.vNN)` into CapApp-SPM/Package.swift. If the
      # extension (iOS 18) were already in there, `.v18` would come out, and
      # the package manager rejects that (tools-version 5.9) - that is how the
      # first runs failed.
      #
      # The Live Activity (CarPlay dashboard, lock screen) is a widget
      # extension, so a target of its own in the Xcode project. The template
      # does not know it; this script hooks it in.
      - name: Add Live Activity
        run: bash tools/ios_widget.sh ios/App

      # The CarPlay scene: second scene in the Info.plist, AppDelegate, and the
      # entitlement - always **with** it here, so that the simulator build
      # checks the whole path. In the signed build (ios-testflight.yml) the
      # entitlement is a switch, until it is enabled for the app ID in the
      # Developer Portal.
      - name: Add CarPlay scene
        run: bash tools/ios_carplay.sh ios/App true

      # On GitHub's macOS image xcbeautify is normally present. The "normally"
      # is the reason for this line: if it ever drops out of the image, the
      # whole pipe fails otherwise, and the failure looks like a build error
      # instead of a missing tool.
      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      # `set -o pipefail` is not cosmetic here: without it the pipe returns
      # the exit code of xcbeautify, and that is zero even if xcodebuild
      # failed before it. The workflow would be green and the build broken -
      # the most unpleasant state a check can have.
      #
      # `generic/platform=iOS Simulator` instead of a device name: which
      # simulators are in the image, GitHub changes without announcement, and
      # a hard-wired "iPhone 16" then drops out.
      #
      # Capacitor 8 pulls in plugins via the Swift Package Manager, not via
      # CocoaPods. There is therefore **no** .xcworkspace, and what is built
      # is `-project`; xcodebuild resolves the packages itself on the first
      # call. The scheme is called "App".
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        shell: bash

      # After a failed build, the generated plist is the first thing you want
      # to see - and it exists only on the runner.
      - name: Save Info.plist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Info.plist
          path: ios/App/App/Info.plist
          if-no-files-found: warn
