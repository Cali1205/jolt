name: iOS

# Der Ablauf beantwortet genau eine Frage: Laesst sich aus package.json und
# capacitor.config.json ein iOS-Projekt erzeugen, das compiliert?
#
# **Der Pfadfilter ist eng, und das ist Absicht.** macos-Laeufer zaehlen bei
# privaten Repositories mit dem Faktor 10 gegen das Minutenkontingent: Fuenf
# Minuten Bauen sind fuenfzig verbrauchte Minuten. Eine Aenderung an
# frontend/ steht bewusst **nicht** in der Liste - die App laedt ihre
# Oberflaeche zur Laufzeit vom Server (siehe server.url in
# capacitor.config.json), eine geaenderte Zeile in live.js braucht also
# keinen neuen App-Bau. Genau deshalb ist der Capacitor-Weg gewaehlt: Der
# schnelle Deploy-Weg ueber den Container bleibt erhalten.
#
# Was hier fehlt, ist ein Geraetebau. Der braeuchte Zertifikat und
# Bereitstellungsprofil als Geheimnisse; fuer "compiliert es ueberhaupt" ist
# das ein hoher Preis. Ausgeliefert wird ueber TestFlight, sobald ein
# Apple-Developer-Programm vorliegt - siehe konzept-ios-app.md.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/ios_info_plist.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/ios_info_plist.sh"
      - ".github/workflows/ios.yml"
  # Von Hand ausloesbar, um den Ablauf einmal zu pruefen, ohne dafuer eine
  # Aenderung erfinden zu muessen.
  workflow_dispatch:

jobs:
  bauen:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 ist Bedingung, nicht Vorliebe: @capacitor/cli gibt bei 20
      # "Unsupported engine" aus.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Der Laeufer bringt mehrere Xcode-Fassungen mit und waehlt nicht
      # unbedingt die neueste. Festlegen statt hoffen: Sonst aendert sich die
      # Werkzeugkette unter dem Projekt weg, sobald GitHub sein Abbild
      # aktualisiert - und der Fehler sieht dann nach einem Codefehler aus.
      - name: Xcode festlegen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fassungen protokollieren
        run: |
          xcodebuild -version
          node --version
          pod --version

      - run: npm ci --no-audit --no-fund

      # ios/ ist nicht eingecheckt und entsteht hier neu. Ein eingechecktes
      # Xcode-Projekt waere eine zweite Wahrheit neben capacitor.config.json,
      # und die beiden liefen unbemerkt auseinander.
      - name: iOS-Projekt erzeugen
        run: npx cap add ios

      # Muss **nach** `cap add` und **vor** dem Bauen laufen: Die Vorlage
      # kennt weder die Bluetooth-Verwendungszwecke noch die
      # Hintergrundmodi. Ohne NSBluetoothAlwaysUsageDescription raeumt iOS
      # die App beim ersten CoreBluetooth-Zugriff ab.
      - name: Info.plist ergaenzen
        run: bash tools/ios_info_plist.sh ios/App/App/Info.plist

      - name: Abgleichen
        run: npx cap sync ios

      # Auf GitHubs macOS-Abbild ist xcbeautify normalerweise vorhanden. Das
      # "normalerweise" ist der Grund fuer diese Zeile: Faellt es einmal aus
      # dem Abbild, scheitert sonst die ganze Pipe, und der Fehler sieht nach
      # einem Baufehler aus statt nach einem fehlenden Werkzeug.
      - name: xcbeautify sicherstellen
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      # `set -o pipefail` ist hier nicht Kosmetik: Ohne sie liefert die Pipe
      # den Rueckgabewert von xcbeautify, und der ist null, auch wenn
      # xcodebuild davor gescheitert ist. Der Ablauf waere gruen und der Bau
      # kaputt - der unangenehmste Zustand, den eine Pruefung haben kann.
      #
      # `generic/platform=iOS Simulator` statt eines Geraetenamens: Welche
      # Simulatoren im Abbild liegen, aendert GitHub ohne Ankuendigung, und
      # ein fest verdrahtetes "iPhone 16" faellt dann aus.
      #
      # Capacitor erzeugt eine Workspace mit CocoaPods; gebaut wird deshalb
      # `-workspace`, nicht `-project`. Das Schema heisst "App".
      - name: Bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        shell: bash

      # Nach einem gescheiterten Bau ist die erzeugte Plist das Erste, was
      # man sehen will - und sie existiert nur auf dem Laeufer.
      - name: Info.plist sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Info.plist
          path: ios/App/App/Info.plist
          if-no-files-found: warn
