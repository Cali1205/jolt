name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - run: ./tools/check_model.py
      - run: ./tools/check_identification.py
      - run: ./tools/check_optimizer.py
      - run: ./tools/check_replanning.py
      - run: ./tools/check_sources.py
      - run: ./tools/check_own.py
      - run: ./tools/check_tomtom.py
      - run: ./tools/check_weather.py
      - run: ./tools/check_ios.py
      - run: ./tools/check_security.py
      - run: ./tools/check_legacy_paths.py
      - run: ./tools/check_push.py
      - run: ./tools/check_backend.py

      # The revisions are the only source of the schema - there is no
      # create_all as a fallback. So the path from zero to head and back
      # again must work, otherwise an existing installation cannot keep up
      # when updating.
      - name: Alembic up and down
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  # frontend/ble-plugin.js is generated, but lives in the repository: the UI
  # is delivered without a build step, so the bundled plugin shell has to sit
  # next to it as a finished file. That is exactly where the danger this job
  # guards against comes from - someone changes tools/ble-shell-entry.js or
  # raises a plugin version and forgets `npm run huelle`. The app would then
  # keep pulling the old shell, and the bug would only show up at the car.
  huelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: @capacitor/cli explicitly requires it
      # ("Unsupported engine" on 20), and esbuild should come from the same
      # environment as when generating.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Rebuild the shell and compare
        run: |
          cp frontend/ble-plugin.js /tmp/ble-plugin.eingecheckt.js
          npm run huelle
          if ! cmp -s /tmp/ble-plugin.eingecheckt.js frontend/ble-plugin.js; then
            echo "::error::frontend/ble-plugin.js is no longer up to date." \
                 "Please run 'npm run huelle' and check in the result."
            exit 1
          fi
          echo "Shell is up to date."

      # The bridge can only be checked completely at the car. What can be
      # established beforehand should be noticed beforehand: the path
      # connect -> services -> notifications -> command -> response is played
      # through here against a simulated dongle, including the fallback to
      # real Web Bluetooth without Capacitor.
      - name: Check Bluetooth bridge
        run: node tools/check_ble_bridge.js

      # The conversions have turned from hand-written functions into table
      # rows. This check keeps the old functions alongside as the reference
      # and compares over several hundred byte sequences - that is exactly
      # where signs, divisors and byte positions silently go wrong in such a
      # rework.
      - name: Check reading table against the old formulas
        run: node tools/check_readings.js

      # The queue for data points in live.js runs against a server that goes
      # down - dead spot, resubmission, rejected batches.
      - name: Check data point queue
        run: node tools/check_buffer.js

      # The location path: browser via navigator.geolocation, iOS app via the
      # background plugin - including the fallback when the app is older than
      # the UI the server delivers to it.
      - name: Check location path
        run: node tools/check_location.js

      # When the dongle may query the car: only while driving, never on a
      # locked car (alarm system) - and reconnect by itself.
      - name: Check driving state
        run: node tools/check_driving_state.js

      # Starting a recording against a dongle that does not respond: it stays
      # in use as long as the connection holds.
      - name: Check recording start
        run: node tools/check_recording.js

      # The traffic tile of the chosen route: the traffic is only in the
      # response of the last planning run, not on the saved trip.
      - name: Check traffic tile
        run: node tools/check_route_display.js

      # Times from the server: UTC, and the browser must never read them as
      # local time. The result must not depend on the time zone - the check
      # runs under four time zones.
      - name: Check timestamps
        run: node tools/check_timestamp.js

      # The settings view shows counters and log of the dongle module. If
      # those are wrong, the diagnosis misleads - and it is needed exactly
      # when something in the car is not right.
      - name: Check dongle diagnostics
        run: node tools/check_diagnose.js

      # The display model for CarPlay and widget: few numbers, throttled,
      # without invented fields - checkable without Swift and without a Mac.
      - name: Check display model
        run: node tools/check_display.js

      # The map jumped when pinching and dragging: gestures against a dummy of
      # the canvas, without a browser.
      - name: Check map controls
        run: node tools/check_map.js

      # Passive listening must not send anything onto the CAN - what is sent
      # is what the alarm system hangs on.
      - name: Check listening
        run: node tools/check_listen.js

      # Starting and stopping a recording from the CarPlay list.
      - name: Check CarPlay actions
        run: node tools/check_carplay_action.js

      # Connecting and listening from the settings, from the tap to the text.
      - name: Check dongle buttons in the settings
        run: node tools/check_settings.js

      # The drawn CarPlay tiles: no text over the edge, no tile crashes
      # without a value, the colors report the right state.
      - name: Check CarPlay tiles
        run: node tools/check_tiles.js
