name: iOS TestFlight

# Signierter Bau und Upload nach TestFlight - der Schritt, der die App aufs
# iPhone bringt. Einrichten laesst er sich ohne Mac, Schritt fuer Schritt in
# ios-einrichten.md.
#
# **Nur von Hand oder per Tag.** Ein macos-Lauf zaehlt bei privaten
# Repositories zehnfach gegen das Minutenkontingent, und ein Upload je Commit
# waere sinnlos: Die App laedt ihre Oberflaeche zur Laufzeit vom Server
# (siehe server.url in capacitor.config.json), eine neue Fassung braucht nur,
# wer an der Huelle etwas aendert - Plugins, Berechtigungen, Symbol.
#
#   - Actions -> "iOS TestFlight" -> Run workflow, oder
#   - git tag ios-1 && git push origin ios-1
#
# **Zwei Arten zu signieren, gewaehlt nach den vorhandenen Geheimnissen:**
#
#   - automatisch (Vorgabe): Nur der App-Store-Connect-API-Schluessel
#     (Rolle Admin) und die Team-ID. Apple legt Zertifikat und Profil selbst
#     an ("Cloud Managed Signing"), xcodebuild holt sie mit
#     -allowProvisioningUpdates.
#   - manuell: Sind zusaetzlich IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD und
#     IOS_PROFILE_BASE64 gesetzt, wird damit signiert, ganz ohne
#     Provisioning-Magie. Der Rueckfall, falls der automatische Weg an
#     etwas scheitert, das sich aus der Ferne nicht klaeren laesst.
#
# Fehlt ein Geheimnis, bricht der erste Schritt ab und nennt alle, die
# fehlen. Das ist Absicht: Lieber hier mit einem Satz scheitern als nach vier
# Minuten Mac-Zeit mit einer Xcode-Meldung ueber ein fehlendes Zertifikat.
on:
  workflow_dispatch:
  push:
    tags: ["ios-*"]

# Zwei gleichzeitige Uploads wuerden um dieselbe Build-Nummer streiten.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      # Aus den Geheimnissen in Umgebungsvariablen, damit die Schritte unten
      # nichts in Skriptzeilen einsetzen muessen (und Werte mit Sonderzeichen
      # nicht die Shell lesen).
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_P8_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}

    steps:
      - name: Geheimnisse pruefen
        shell: bash
        run: |
          fehlt=""
          for name in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID \
                      APPSTORE_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then fehlt="$fehlt $name"; fi
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Es fehlen Repository-Geheimnisse:$fehlt - siehe ios-einrichten.md, Abschnitt 'Geheimnisse'."
            exit 1
          fi

          # Entweder alle drei manuellen Geheimnisse oder keines: Ein halber
          # Satz ist fast immer ein vergessener Eintrag, und stillschweigend
          # automatisch zu signieren wuerde das verdecken.
          manuell=0
          for name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROFILE_BASE64; do
            if [ -n "${!name}" ]; then manuell=$((manuell + 1)); fi
          done
          if [ "$manuell" = "3" ]; then
            echo "MODUS=manuell" >> "$GITHUB_ENV"
            echo "Signatur: manuell (Zertifikat und Profil aus den Geheimnissen)."
          elif [ "$manuell" = "0" ]; then
            echo "MODUS=automatisch" >> "$GITHUB_ENV"
            echo "Signatur: automatisch (Apple verwaltet Zertifikat und Profil)."
          else
            echo "::error::Von IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD und IOS_PROFILE_BASE64 sind nur $manuell von 3 gesetzt. Entweder alle drei oder keines."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Xcode festlegen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci --no-audit --no-fund

      # Dieselbe Vorbereitung wie in ios.yml. Was dort gruen baut, soll hier
      # nur noch zusaetzlich signiert werden - nicht ein anderes Projekt sein.
      - name: iOS-Projekt erzeugen und ergaenzen
        run: |
          npx cap add ios
          bash tools/ios_info_plist.sh ios/App/App/Info.plist
          bash tools/ios_symbol.sh
          npx cap sync ios

      # Eigener, fluechtiger Schluesselbund: Das Zertifikat soll weder im
      # Anmelde-Schluesselbund des Laeufers landen noch nach dem Lauf
      # bleiben. `set-key-partition-list` ist die Zeile, ohne die codesign
      # im Hintergrund auf eine Passwortabfrage wartet, die niemand
      # beantwortet - und der Bau haengt bis zum Zeitlimit.
      - name: Zertifikat und Profil einrichten
        if: env.MODUS == 'manuell'
        shell: bash
        run: |
          set -euo pipefail
          SCHLUESSELBUND="$RUNNER_TEMP/jolt-signatur.keychain-db"
          SCHLUESSELBUND_PW="$(uuidgen)"
          echo "SCHLUESSELBUND=$SCHLUESSELBUND" >> "$GITHUB_ENV"

          security create-keychain -p "$SCHLUESSELBUND_PW" "$SCHLUESSELBUND"
          security set-keychain-settings -lut 21600 "$SCHLUESSELBUND"
          security unlock-keychain -p "$SCHLUESSELBUND_PW" "$SCHLUESSELBUND"

          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/zertifikat.p12"
          security import "$RUNNER_TEMP/zertifikat.p12" -k "$SCHLUESSELBUND" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$SCHLUESSELBUND_PW" "$SCHLUESSELBUND" >/dev/null
          # An die Suchliste anhaengen, ohne die vorhandenen zu verlieren.
          security list-keychains -d user -s "$SCHLUESSELBUND" \
            $(security list-keychains -d user | tr -d '"')

          echo "Identitaeten im Schluesselbund:"
          security find-identity -v -p codesigning "$SCHLUESSELBUND"

          # Name und UUID stehen im Profil selbst; beides wird gebraucht
          # (Name fuer das Xcode-Ziel, UUID fuer den Dateinamen).
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profil.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" > "$RUNNER_TEMP/profil.plist"
          PROFIL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profil.plist")"
          PROFIL_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profil.plist")"
          PROFIL_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profil.plist")"
          PROFIL_APP="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profil.plist")"
          BUNDLE_ID="$(node -p "require('./capacitor.config.json').appId")"

          # Passt das Profil nicht zur App, meldet Xcode das erst im
          # Archivschritt und dann kryptisch. Hier ist es ein Satz.
          if [ "$PROFIL_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Das Profil gehoert zu Team $PROFIL_TEAM, APPLE_TEAM_ID ist $APPLE_TEAM_ID."
            exit 1
          fi
          if [ "$PROFIL_APP" != "$APPLE_TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Das Profil ist fuer $PROFIL_APP, die App heisst $APPLE_TEAM_ID.$BUNDLE_ID (capacitor.config.json)."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profil.plist" >/dev/null 2>&1; then
            echo "::error::Das Profil enthaelt eine Geraeteliste - das ist ein Entwicklungs- oder Ad-hoc-Profil. TestFlight braucht ein App-Store-Profil."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profil.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFIL_UUID.mobileprovision"

          echo "PROFIL_NAME=$PROFIL_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Profil: $PROFIL_NAME ($PROFIL_UUID) fuer $BUNDLE_ID"

      - name: Signatur im Projekt setzen
        if: env.MODUS == 'manuell'
        run: bash tools/ios_signatur.sh ios/App/App.xcodeproj/project.pbxproj "$APPLE_TEAM_ID" "$PROFIL_NAME"

      # Der API-Schluessel liegt dort, wo xcodebuild ihn erwartet. Er wird in
      # beiden Betriebsarten gebraucht: zum Hochladen immer, zum Anlegen von
      # Zertifikat und Profil im automatischen Modus.
      - name: API-Schluessel ablegen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          SCHLUESSEL="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "$APPSTORE_KEY_P8_BASE64" | base64 --decode > "$SCHLUESSEL"
          chmod 600 "$SCHLUESSEL"
          echo "SCHLUESSEL=$SCHLUESSEL" >> "$GITHUB_ENV"

      # Die Build-Nummer muss bei jedem Upload steigen, sonst weist App Store
      # Connect ihn ab. Die laufende Nummer des Workflows tut das von selbst
      # und braucht keinen Zustand im Repository; mal zehn plus Versuch, weil
      # ein erneut ausgefuehrter Lauf (Re-run) dieselbe Nummer behaelt und
      # sonst als Duplikat abgewiesen wuerde. Die sichtbare Version
      # (MARKETING_VERSION, 1.0) bleibt, bis jemand sie bewusst anhebt.
      - name: Archivieren
        shell: bash
        run: |
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          # Im automatischen Modus muss xcodebuild Zertifikat und Profil bei
          # Apple anlegen duerfen. Das Team steht dann auf der Kommandozeile,
          # weil die Vorlage keines kennt; im manuellen steht es schon im
          # Projekt (tools/ios_signatur.sh).
          EXTRA=()
          if [ "$MODUS" = "automatisch" ]; then
            EXTRA=(-allowProvisioningUpdates
                   -authenticationKeyPath "$SCHLUESSEL"
                   -authenticationKeyID "$APPSTORE_KEY_ID"
                   -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
                   DEVELOPMENT_TEAM="$APPLE_TEAM_ID")
          fi
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/jolt.xcarchive" \
            CURRENT_PROJECT_VERSION="$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))" \
            "${EXTRA[@]}" \
            | xcbeautify --renderer github-actions

      # `destination: upload` laesst xcodebuild den Bau gleich nach App Store
      # Connect schicken - ohne altool und ohne zweiten Schritt. Die
      # Anmeldung laeuft ueber den API-Schluessel, nicht ueber ein
      # Apple-ID-Passwort mit Zwei-Faktor.
      - name: Exportieren und hochladen
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          if [ "$MODUS" = "manuell" ]; then
            SIGNATUR="<key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFIL_NAME}</string></dict>"
            EXTRA=()
          else
            SIGNATUR="<key>signingStyle</key><string>automatic</string>"
            EXTRA=(-allowProvisioningUpdates)
          fi

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            ${SIGNATUR}
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/jolt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$SCHLUESSEL" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      # Das Archiv ist das Erste, was man nach einem gescheiterten Export
      # sehen will - und es liegt nur auf dem Laeufer. Bewusst nur die
      # Verwaltungsdateien, nicht die App selbst.
      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-protokolle
          path: |
            ${{ runner.temp }}/jolt.xcarchive/Info.plist
            ${{ runner.temp }}/export/*.plist
            ${{ runner.temp }}/export/*.log
            ios/App/App/Info.plist
          if-no-files-found: ignore
          retention-days: 14

      # Zertifikat und Schluessel duerfen den Lauf nicht ueberleben. Auf einem
      # GitHub-Laeufer verschwindet die Maschine ohnehin; auf einem
      # selbst gehosteten bliebe das hier sonst liegen.
      - name: Aufraeumen
        if: always()
        shell: bash
        run: |
          if [ -n "${SCHLUESSELBUND:-}" ]; then security delete-keychain "$SCHLUESSELBUND" || true; fi
          rm -f "$RUNNER_TEMP/zertifikat.p12" "$RUNNER_TEMP/profil.mobileprovision" \
                "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
