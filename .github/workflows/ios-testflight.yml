name: iOS TestFlight

# Signed build and upload to TestFlight - the step that gets the app onto the
# iPhone. It can be set up without a Mac, step by step in ios-einrichten.md.
#
# **Only by hand or by tag.** A macOS run counts tenfold against the minutes
# quota on private repositories, and an upload per commit would be pointless:
# the app loads its UI from the server at runtime (see server.url in
# capacitor.config.json), so a new version is only needed by whoever changes
# something in the shell - plugins, permissions, icon.
#
#   - Actions -> "iOS TestFlight" -> Run workflow, or
#   - git tag ios-1 && git push origin ios-1
#
# **Two ways to sign, chosen by the secrets that are present:**
#
#   - automatic (default): only the App Store Connect API key (role Admin)
#     and the team ID. Apple creates the certificate and profile itself
#     ("Cloud Managed Signing"), xcodebuild fetches them with
#     -allowProvisioningUpdates.
#   - manual: if IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD and
#     IOS_PROFILE_BASE64 are also set, signing uses those, without any
#     provisioning magic. The fallback in case the automatic route fails on
#     something that cannot be clarified remotely.
#
# If a secret is missing, the first step aborts and names all that are
# missing. That is deliberate: better to fail here with one sentence than
# after four minutes of Mac time with an Xcode message about a missing
# certificate.
on:
  workflow_dispatch:
    inputs:
      carplay:
        description: >-
          Include the CarPlay entitlement. Only tick this if "CarPlay EV
          Charging" is enabled for the app ID in the Developer Portal -
          otherwise the export aborts. Permanently: repository variable
          CARPLAY_ENTITLEMENT = true.
        type: boolean
        default: false
  push:
    tags: ["ios-*"]

# Two simultaneous uploads would fight over the same build number.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      # From the secrets into environment variables, so that the steps below
      # do not have to substitute anything into script lines (and values with
      # special characters are not read by the shell).
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_P8_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}

    steps:
      - name: Check secrets
        shell: bash
        run: |
          missing=""
          for name in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID \
                      APPSTORE_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets are missing:$missing - see ios-einrichten.md, section 'Geheimnisse' (secrets)."
            exit 1
          fi

          # Either all three manual secrets or none: a partial set is almost
          # always a forgotten entry, and silently signing automatically
          # would hide that.
          manual_count=0
          for name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROFILE_BASE64; do
            if [ -n "${!name}" ]; then manual_count=$((manual_count + 1)); fi
          done
          if [ "$manual_count" = "3" ]; then
            echo "MODUS=manuell" >> "$GITHUB_ENV"
            echo "Signing: manual (certificate and profile from the secrets)."
          elif [ "$manual_count" = "0" ]; then
            echo "MODUS=automatisch" >> "$GITHUB_ENV"
            echo "Signing: automatic (Apple manages certificate and profile)."
          else
            echo "::error::Only $manual_count of 3 of IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD and IOS_PROFILE_BASE64 are set. Either all three or none."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci --no-audit --no-fund

      # The same preparation as in ios.yml. What builds green there should
      # here merely be signed in addition - not be a different project.
      - name: Generate and extend iOS project
        run: |
          npx cap add ios
          bash tools/ios_info_plist.sh ios/App/App/Info.plist
          bash tools/ios_symbol.sh
          npx cap sync ios

      # A separate, ephemeral keychain: the certificate should neither end up
      # in the runner's login keychain nor remain after the run.
      # `set-key-partition-list` is the line without which codesign waits in
      # the background for a password prompt that nobody answers - and the
      # build hangs until the time limit.
      - name: Set up certificate and profile
        if: env.MODUS == 'manuell'
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_KEYCHAIN="$RUNNER_TEMP/jolt-signatur.keychain-db"
          SIGNING_KEYCHAIN_PW="$(uuidgen)"
          echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN"

          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/zertifikat.p12"
          security import "$RUNNER_TEMP/zertifikat.p12" -k "$SIGNING_KEYCHAIN" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN" >/dev/null
          # Append to the search list without losing the existing ones.
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          echo "Identities in the keychain:"
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN"

          # Name and UUID are in the profile itself; both are needed
          # (name for the Xcode target, UUID for the file name).
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profil.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" > "$RUNNER_TEMP/profil.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profil.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profil.plist")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profil.plist")"
          PROFILE_APP="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profil.plist")"
          BUNDLE_ID="$(node -p "require('./capacitor.config.json').appId")"

          # If the profile does not match the app, Xcode only reports it in the
          # archive step, and cryptically. Here it is one sentence.
          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::The profile belongs to team $PROFILE_TEAM, APPLE_TEAM_ID is $APPLE_TEAM_ID."
            exit 1
          fi
          if [ "$PROFILE_APP" != "$APPLE_TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::The profile is for $PROFILE_APP, the app is called $APPLE_TEAM_ID.$BUNDLE_ID (capacitor.config.json)."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profil.plist" >/dev/null 2>&1; then
            echo "::error::The profile contains a device list - that is a development or ad-hoc profile. TestFlight needs an App Store profile."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profil.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID) for $BUNDLE_ID"

      - name: Set signing in the project
        if: env.MODUS == 'manuell'
        run: bash tools/ios_signatur.sh ios/App/App.xcodeproj/project.pbxproj "$APPLE_TEAM_ID" "$PROFILE_NAME"

      # The Live Activity is a target of its own (widget extension) with its
      # own bundle identifier <app ID>.widget. It comes **after** the manual
      # signing, which expects exactly two places in the app target. In
      # automatic mode, Apple creates the extension's identifier and profile
      # itself on export; in manual mode there is no profile for it in the
      # secrets.
      - name: Add Live Activity
        shell: bash
        run: |
          if [ "$MODUS" = "manuell" ]; then
            echo "::warning::Manual signing: there is no profile for the Live Activity (<app ID>.widget) - the export will fail. Sign automatically or add a second profile."
          fi
          bash tools/ios_widget.sh ios/App "$APPLE_TEAM_ID"

      # The CarPlay scene (Info.plist, AppDelegate) is always included; the
      # **entitlement** only if it is enabled for the app ID in the portal. If
      # it is in the app but not in the profile, the export fails with a
      # message about a profile that does not match.
      - name: Add CarPlay scene
        shell: bash
        env:
          CARPLAY: ${{ inputs.carplay == true || vars.CARPLAY_ENTITLEMENT == 'true' }}
        run: |
          echo "CarPlay entitlement: $CARPLAY"
          bash tools/ios_carplay.sh ios/App "$CARPLAY"

      # The API key goes where xcodebuild expects it. It is needed in both
      # modes: always for uploading, and for creating the certificate and
      # profile in automatic mode.
      - name: Store API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          API_KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "$APPSTORE_KEY_P8_BASE64" | base64 --decode > "$API_KEY_FILE"
          chmod 600 "$API_KEY_FILE"
          echo "API_KEY_FILE=$API_KEY_FILE" >> "$GITHUB_ENV"

      # The build number must increase with every upload, otherwise App Store
      # Connect rejects it. The workflow's run number does that on its own and
      # needs no state in the repository; multiplied by ten plus the attempt,
      # because a re-run keeps the same number and would otherwise be
      # rejected as a duplicate. The visible version (MARKETING_VERSION)
      # comes from the VERSION file.
      - name: Archive
        shell: bash
        run: |
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          # In automatic mode the archive is built **unsigned** and only
          # signed on export. Otherwise the first run failed on
          # "Your team has no devices": when archiving, Xcode demands a
          # development profile, and that only exists for registered devices.
          # The App Store profile on export does not need one. In manual
          # mode, team and profile are already in the project (ios_signatur.sh).
          EXTRA=()
          if [ "$MODUS" = "automatisch" ]; then
            EXTRA=(CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="$APPLE_TEAM_ID")
          fi
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/jolt.xcarchive" \
            MARKETING_VERSION="$(tr -d '[:space:]' < VERSION)" \
            CURRENT_PROJECT_VERSION="$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))" \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            | xcbeautify --renderer github-actions

      # The unsigned archive carries no entitlements: the export only signs
      # with what it finds in the app, and the build is green even though
      # CarPlay is missing. Hence the entitlements are written ad hoc into the
      # archived app before the export (the export re-signs afterwards but
      # keeps them) and put into the log so that they can be read back.
      - name: Entitlements into the archive
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/jolt.xcarchive/Products/Applications/App.app"
          ENT="ios/App/App/App.entitlements"
          if [ -f "$ENT" ] && [ "$MODUS" = "automatisch" ]; then
            codesign --force --sign - --entitlements "$ENT" "$APP_PATH"
          fi
          echo "Entitlements of the archived app:"
          codesign -d --entitlements :- "$APP_PATH" 2>&1 || true

      # `destination: upload` has xcodebuild send the build straight to App
      # Store Connect - without altool and without a second step. Login goes
      # through the API key, not through an Apple ID password with two-factor.
      - name: Export and upload
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          if [ "$MODUS" = "manuell" ]; then
            SIGNING="<key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>"
            EXTRA=()
          else
            SIGNING="<key>signingStyle</key><string>automatic</string>"
            EXTRA=(-allowProvisioningUpdates)
          fi

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            ${SIGNING}
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/jolt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$API_KEY_FILE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      # The archive is the first thing you want to see after a failed export -
      # and it only exists on the runner. Deliberately only the management
      # files, not the app itself.
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-protokolle
          path: |
            ${{ runner.temp }}/jolt.xcarchive/Info.plist
            ${{ runner.temp }}/export/*.plist
            ${{ runner.temp }}/export/*.log
            ios/App/App/Info.plist
          if-no-files-found: ignore
          retention-days: 14

      # Certificate and key must not outlive the run. On a GitHub runner the
      # machine disappears anyway; on a self-hosted one this would otherwise
      # be left lying around.
      - name: Clean up
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/zertifikat.p12" "$RUNNER_TEMP/profil.mobileprovision" \
                "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
